{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifique seu E-mail - ImobGold</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .auth-bg {
            background: linear-gradient(135deg, #0A0F1C 0%, #1a2235 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="auth-bg min-h-screen flex items-center justify-center p-6 text-white font-sans selection:bg-[#C6A87C]">

    <div class="glass-panel p-8 md:p-12 rounded-3xl shadow-2xl w-full max-w-md relative overflow-hidden text-center">
        <!-- Decorativo -->
        <div class="absolute -top-20 -left-20 w-40 h-40 bg-[#C6A87C] rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>

        <div class="relative z-10">
            <div class="w-20 h-20 mx-auto bg-[#C6A87C]/20 rounded-full flex items-center justify-center mb-6">
                <svg class="w-10 h-10 text-[#C6A87C]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </div>
            
            <h1 class="text-2xl font-bold mb-4">Verifique seu E-mail</h1>
            
            <p class="text-white/70 mb-8 leading-relaxed">
                Enviamos um link mágico de acesso para o seu endereço de e-mail. 
                Por favor, acesse sua caixa de entrada (e a pasta de spam) e clique no link para iniciar a configuração da sua plataforma.
            </p>

            <a href="/" class="inline-block text-[#C6A87C] hover:text-white transition font-medium">Voltar para a página inicial</a>
        </div>
    </div>

</body>
</html>
