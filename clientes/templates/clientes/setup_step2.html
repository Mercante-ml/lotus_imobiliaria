<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passo 2 - Branding - ImobGold</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    
    <div class="max-w-2xl mx-auto mt-12 bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
        <!-- Progress Bar -->
        <div class="flex items-center justify-between mb-8 relative">
            <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-gray-200 -z-10"></div>
            <div class="absolute left-0 top-1/2 -translate-y-1/2 w-2/4 h-1 bg-[#C6A87C] -z-10"></div>
            
            <div class="w-8 h-8 rounded-full bg-[#C6A87C] text-white flex items-center justify-center font-bold text-sm">✓</div>
            <div class="w-8 h-8 rounded-full bg-[#C6A87C] text-white flex items-center justify-center font-bold text-sm">2</div>
            <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold text-sm">3</div>
            <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold text-sm">4</div>
        </div>

        <h1 class="text-3xl font-serif text-gray-900 mb-2">Marca & Portfólio</h1>
        <p class="text-gray-500 mb-8">Personalize a cara da sua nova plataforma.</p>

        <form method="POST" action="{% url 'saas_setup' 2 %}">
            {% csrf_token %}
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ form.subdominio.label }}</label>
                    <div class="flex items-center">
                        <input type="text" name="{{ form.subdominio.name }}" value="{{ form.subdominio.value|default:'' }}" required placeholder="nomedaimobiliaria"
                               class="w-full px-4 py-3 rounded-l-lg border border-gray-300 focus:ring-2 focus:ring-[#C6A87C] focus:border-[#C6A87C] outline-none transition">
                        <span class="bg-gray-100 border border-l-0 border-gray-300 px-4 py-3 rounded-r-lg text-gray-500">.imob.dsprime.org</span>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">{{ form.cor_primaria.label }}</label>
                    <select name="{{ form.cor_primaria.name }}" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#C6A87C] outline-none">
                        {% for value, label in form.cor_primaria.field.choices %}
                            <option value="{{ value }}" {% if form.cor_primaria.value == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="pt-4 border-t border-gray-100">
                    <label class="block text-sm font-medium text-gray-900 mb-3">O que você vai vender?</label>
                    <div class="space-y-3">
                        <label class="flex items-center gap-3">
                            <input type="checkbox" name="{{ form.portfolio_lancamento.name }}" class="w-5 h-5 text-[#C6A87C] rounded focus:ring-[#C6A87C]" {% if form.portfolio_lancamento.value %}checked{% endif %}>
                            <span class="text-gray-700">Imóveis de Lançamento (Na Planta)</span>
                        </label>
                        <label class="flex items-center gap-3">
                            <input type="checkbox" name="{{ form.portfolio_revenda.name }}" class="w-5 h-5 text-[#C6A87C] rounded focus:ring-[#C6A87C]" {% if form.portfolio_revenda.value %}checked{% endif %}>
                            <span class="text-gray-700">Imóveis de Revenda (Prontos)</span>
                        </label>
                        <label class="flex items-center gap-3">
                            <input type="checkbox" name="{{ form.portfolio_aluguel.name }}" class="w-5 h-5 text-[#C6A87C] rounded focus:ring-[#C6A87C]" {% if form.portfolio_aluguel.value %}checked{% endif %}>
                            <span class="text-gray-700">Aluguel / Locação</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="mt-10 flex justify-between">
                <a href="{% url 'saas_setup' 1 %}" class="text-gray-500 px-6 py-3 hover:text-gray-900 transition">Voltar</a>
                <button type="submit" class="bg-gray-900 text-white px-8 py-3 rounded-lg font-medium hover:bg-gray-800 transition">
                    Próximo Passo &rarr;
                </button>
            </div>
        </form>
    </div>

</body>
</html>
