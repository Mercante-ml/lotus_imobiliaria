<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passo 6 - Central de Blog - Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/imask"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap');
        .font-serif { font-family: 'Playfair Display', serif !important; }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center py-12">
    
    <div class="w-full max-w-4xl mx-auto bg-white p-8 md:p-12 rounded-3xl shadow-xl shadow-gray-200/50 border border-gray-100">
        
        <div class="flex items-center justify-between mb-8 relative">
            <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-gray-200 -z-10"></div>
            <div class="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-[#C6A87C] -z-10 transition-all duration-500" style="width: 71.42857142857143%;"></div>
            <div class="w-8 h-8 rounded-full bg-[#C6A87C] text-white flex items-center justify-center font-bold text-sm shrink-0">1</div><div class="w-8 h-8 rounded-full bg-[#C6A87C] text-white flex items-center justify-center font-bold text-sm shrink-0">2</div><div class="w-8 h-8 rounded-full bg-[#C6A87C] text-white flex items-center justify-center font-bold text-sm shrink-0">3</div><div class="w-8 h-8 rounded-full bg-[#C6A87C] text-white flex items-center justify-center font-bold text-sm shrink-0">4</div><div class="w-8 h-8 rounded-full bg-[#C6A87C] text-white flex items-center justify-center font-bold text-sm shrink-0">5</div><div class="w-8 h-8 rounded-full bg-[#C6A87C] text-white ring-4 ring-[#C6A87C]/30 flex items-center justify-center font-bold text-sm shrink-0">6</div><div class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold text-sm shrink-0">7</div><div class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold text-sm shrink-0">8</div>
        </div>
    

        <h1 class="text-4xl font-serif text-gray-900 mb-2">Central de Blog</h1>
        <p class="text-gray-500 mb-10 text-lg">Atraia visitantes com artigos e materiais ricos.</p>

        <form method="POST" action="{% url 'saas_setup' 6 %}" >
            {% csrf_token %}
            
            <div class="space-y-6">
                
    <div class="space-y-6">
        <div class="flex items-center gap-4 bg-gray-50 p-6 rounded-2xl border border-gray-200">
            <label class="relative inline-flex items-center cursor-pointer shrink-0">
                <input type="checkbox" name="exibir_blog" id="toggle_blog" onchange="toggleContent()" {% if form.exibir_blog.value or form.exibir_blog.value is None %}checked{% endif %} class="sr-only peer">
                <div class="w-14 h-7 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-[#C6A87C]"></div>
            </label>
            <div>
                <h4 class="font-bold text-gray-900 text-lg">Ativar Módulo de Blog / Notícias</h4>
                <p class="text-sm text-gray-500">Módulo incrível para publicar artigos em PDF, links e vídeos do YouTube. Você poderá gerenciá-los pelo painel CRM.</p>
            </div>
        </div>
        <input type="hidden" name="acao_blog" value="pular">
    </div>

            </div>

            <div class="mt-12 flex justify-between items-center pt-6 border-t border-gray-100">
                <a href="{% url 'saas_setup' 5 %}" class="text-gray-500 hover:text-gray-900 font-medium px-4 py-2 transition">&larr; Voltar</a>
                <button type="submit" id="btnSubmit" class="bg-gray-900 text-white px-8 py-4 rounded-xl font-bold hover:bg-[#C6A87C] transition shadow-lg flex items-center gap-2" >
                    Próximo Passo <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </form>
    </div>

    
<script>
    function toggleContent() {
        var isChecked = document.getElementById('toggle_blog').checked;
        var content = document.getElementById('blog_content');
        if(content) {
            if(isChecked) { content.classList.remove('opacity-50', 'pointer-events-none'); }
            else { content.classList.add('opacity-50', 'pointer-events-none'); }
        }
    }
    
    toggleContent();
</script>

</body>
</html>
