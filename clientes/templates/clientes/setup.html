<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração da Plataforma - ImobGold</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    
    <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-lg">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Bem-vindo(a)! 🎉</h1>
        <p class="text-gray-500 mb-8">Vamos configurar a sua vitrine digital de alto padrão em menos de 1 minuto.</p>
        
        <form method="POST" action="{% url 'saas_setup' %}">
            {% csrf_token %}
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Qual o nome da sua Imobiliária?</label>
                <input type="text" name="nome" placeholder="Ex: Alpha Imóveis de Luxo" required
                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 outline-none transition">
            </div>
            
            <div class="mb-8">
                <label class="block text-sm font-medium text-gray-700 mb-2">Qual domínio você deseja usar?</label>
                <div class="flex items-center">
                    <input type="text" name="dominio" placeholder="ex: alpha" required
                           class="w-full px-4 py-3 rounded-l-lg border border-gray-300 focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 outline-none transition">
                    <span class="bg-gray-100 border border-l-0 border-gray-300 px-4 py-3 rounded-r-lg text-gray-500">.imob.dsprime.org</span>
                </div>
                <p class="text-xs text-gray-400 mt-2">Você poderá configurar seu domínio próprio (.com.br) depois no painel.</p>
            </div>
            
            <button type="submit" class="w-full bg-gray-900 text-white font-bold py-4 rounded-lg hover:bg-gray-800 transition shadow-lg">
                Criar Minha Plataforma
            </button>
        </form>
    </div>

</body>
</html>
